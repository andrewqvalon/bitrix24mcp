[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitrix24mcp"
version = "0.1.0"
description = "MCP server for Bitrix24 CRM – cached read layer + write-through"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
webhook = ["starlette>=0.40.0", "uvicorn>=0.30.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
]

[project.scripts]
bitrix24mcp = "bitrix24mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bitrix24mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
