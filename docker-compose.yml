services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bitrix24mcp
      POSTGRES_PASSWORD: bitrix24mcp
      POSTGRES_DB: bitrix24mcp
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
